name: Alpha AI Pipeline

on:
  schedule:
    - cron: '0 14 * * 2'  # Every Tuesday at 10am EDT (14:00 UTC) — weekly briefing
  workflow_dispatch:       # Manual run from the GitHub UI; pick the mode below
    inputs:
      mode:
        description: "collect = weekly briefing, roundup = draft an issue now"
        type: choice
        options:
          - collect
          - roundup
        default: collect

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # Scheduled runs have no inputs, so they default to the weekly briefing.
      MODE: ${{ github.event.inputs.mode || 'collect' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (${{ github.event.inputs.mode || 'collect' }})
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Reddit uses public RSS (no key). Bump the delay so the data-center IP
          # stays under the per-IP rate limit; the job has plenty of time budget.
          REDDIT_REQUEST_DELAY: "30"
        run: python main.py --mode "$MODE"

      - name: Commit and push results
        run: |
          git config user.name "alpha-ai-bot"
          git config user.email "actions@github.com"
          git add briefings/ roundups/ roundup_state.json seen_urls.json coverage.json
          git diff --staged --quiet || git commit -m "$MODE: $(date +%Y-%m-%d)"
          git push

      - name: Set email metadata
        id: meta
        run: |
          echo "today=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          # Stable subject prefixes: the editor's Gmail filter labels on
          # subject "Alpha AI" — keep both subjects starting with it.
          if [ "$MODE" = "roundup" ]; then
            echo "subject=Alpha AI Roundup Draft — $(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          else
            echo "subject=Alpha AI Briefing — $(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      # Only email when the run actually produced something. If the pipeline
      # exited early (e.g. today's briefing already exists, or too few
      # candidates for a roundup), run_summary.html is never written and this
      # step is skipped rather than sending an empty/broken notification.
      - name: Send email
        if: ${{ hashFiles('run_summary.html') != '' }}
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.meta.outputs.subject }}
          to: ${{ secrets.GMAIL_USERNAME }}
          from: Alpha AI <${{ secrets.GMAIL_USERNAME }}>
          html_body: file://run_summary.html
