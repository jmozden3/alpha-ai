name: Weekly AI Newsletter

on:
  schedule:
    - cron: '0 14 * * 2'  # Every Tuesday at 10am EDT (14:00 UTC)
  workflow_dispatch:       # Also allows manual run from GitHub UI anytime

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Reddit uses public RSS (no key). Bump the delay so the data-center IP
          # stays under the per-IP rate limit; the job has plenty of time budget.
          REDDIT_REQUEST_DELAY: "30"
        run: python main.py

      - name: Commit and push newsletter
        run: |
          git config user.name "alpha-ai-bot"
          git config user.email "actions@github.com"
          git add newsletters/ seen_urls.json coverage.json
          git diff --staged --quiet || git commit -m "newsletter: $(date +%Y-%m-%d)"
          git push

      - name: Set today's date
        id: date
        run: echo "today=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      # Only email when an issue was actually produced. On biweekly "off" weeks
      # main.py exits early and never writes run_summary.html, so this step is
      # skipped rather than sending an empty/broken notification.
      - name: Send email notification
        if: ${{ hashFiles('run_summary.html') != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Alpha AI Newsletter Ready — ${{ steps.date.outputs.today }}"
          to: ${{ secrets.GMAIL_USERNAME }}
          from: Alpha AI <${{ secrets.GMAIL_USERNAME }}>
          html_body: file://run_summary.html
