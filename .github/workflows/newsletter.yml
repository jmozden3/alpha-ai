name: Weekly AI Newsletter

on:
  schedule:
    - cron: '0 14 * * 2'  # Every Tuesday at 9am ET (14:00 UTC)
  workflow_dispatch:       # Also allows manual run from GitHub UI anytime

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Commit and push newsletter
        run: |
          git config user.name "alpha-ai-bot"
          git config user.email "actions@github.com"
          git add newsletters/
          git diff --staged --quiet || git commit -m "newsletter: $(date +%Y-%m-%d)"
          git push
